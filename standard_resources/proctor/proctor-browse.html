<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WellSharp Proctor - Browse Classes</title>
    <link rel="stylesheet" href="css/proctor.css" />
  </head>
  <body>
    <main class="proctor-shell">
      <header class="topbar">
        <img class="brand-logo" src="assets/iadcLoginLgo.png" alt="IADC WellSharp" />
        <div class="user-tools"><div class="user-line"><strong>Abraham Kotb</strong><button class="signout">Sign Out</button></div><a href="https://intellidata.tech/wellsharp/support1/" class="support-link" target="_blank" rel="noopener">Database/Program Assistance?</a><a href="https://intellidata.tech/wellsharp/support2/" class="support-link" target="_blank" rel="noopener">Proctor Assistance?</a></div>
      </header>
      <div class="main-area">
                        <aside class="proctor-sidebar">
          <a class="nav-item" href="proctor-home.html"><span class="nav-icon">&#8962;</span>Home</a>
          <a class="nav-item" href="proctor-profile.html"><span class="nav-icon">&#128100;</span>My Profile</a>
          <a class="nav-item" href="proctor-analytics.html"><span class="nav-icon">&#9685;</span>Analytics</a>
          <a class="nav-item" href="proctor-classes.html"><span class="nav-icon">&#127891;</span>Classes</a>
          <a class="nav-item active" href="proctor-browse.html"><span class="nav-icon">&#127963;</span>Browse Classes</a>
          <a class="nav-item" href="proctor-certificate.html"><span class="nav-icon">&#128269;</span>Certificate Lookup</a>
          <button class="collapse-btn">Collapse</button>
        </aside>
        <section class="workspace browse-results-workspace">
          <section class="panel">
            <div class="panel-title">Search Options</div>
            <div class="panel-body">
              <form class="search-form">
                <div>
                  <div class="form-line"><label>Class Title or ID:</label><input /></div>
                  <div class="form-line"><label>Date Filter:</label><div class="date-inputs"><input placeholder="Start Date" /><span>to</span><input placeholder="End Date" /></div></div>
                  <div class="form-line"><label>Exam Date:</label><input placeholder="Test Date" /></div>
                  <div class="form-line"><label>City:</label><input /></div>
                  <div class="form-line"><label>Country:</label><select><option>All Countries</option></select></div>
                  <div class="form-line"><label>State:</label><select><option>All States</option></select></div>
                </div>
                <div>
                  <div class="form-line"><label>Course:</label><select><option>All Courses</option></select></div>
                  <div class="form-line"><label>Instructor:</label><select><option>All Instructors</option></select></div>
                  <div class="form-line"><label>Retakes:</label><select><option>(All)</option></select></div>
                  <div class="form-line"><label>Deployment:</label><select><option>Select an Option</option></select></div>
                </div>
                <div class="search-actions"><a class="blue-btn" href="proctor-browse-results.html">Search Classes</a></div>
              </form>
            </div>
          </section>
          <a class="export-btn" href="#">Export Excel</a>
        </section>
      </div>
      <footer class="footer"><div class="footer-copy"><a href="#">Technical Support</a><span>SkillGRID&reg; (online) | Version 3.0 | &copy; 2024 Indaptive Technologies Inc.</span></div><img class="footer-logo" src="assets/ws-login_SG-Logo.png" alt="SkillGRID" /></footer>
    </main>
    <script src="js/proctor-menu.js"></script>
  </body>
</html>
