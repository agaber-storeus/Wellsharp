<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WellSharp Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-label="WellSharp login">
        <header class="card-header">
          <img
            class="iadc-logo"
            src="assets/iadcLoginLgo.png"
            alt="IADC WellSharp"
          />
        </header>

        <div class="hero-area">
          <form class="login-form" action="student-confirm.html" method="get">
            <input
              class="field"
              type="text"
              name="loginid"
              placeholder="WellSharp&reg; ID"
              aria-label="WellSharp ID"
            />
            <input
              class="field"
              type="password"
              name="password"
              placeholder="Password"
              aria-label="Password"
            />
            <button class="login-button" type="submit">Login</button>
            <a class="small-link forgot-link" href="#">Forgot your password?</a>
          </form>

          <img
            class="rig-image"
            src="assets/login_imageZo.jpg"
            alt="WellSharp drilling site"
          />
        </div>

        <footer class="card-footer">
          <div class="support-links">
            <a class="small-link" href="https://intellidata.tech/wellsharp/support1/" target="_blank" rel="noopener">Database/Program Assistance?</a>
            <a class="small-link" href="https://intellidata.tech/wellsharp/support2/" target="_blank" rel="noopener">Proctor Assistance?</a>
          </div>
          <a class="small-link requirements-link" href="#">Requirements</a>
          <img
            class="skill-logo"
            src="assets/ws-login_SG-Logo.png"
            alt="SkillGRADER"
          />
        </footer>
      </section>

      <p class="copyright">SkillSTICK&reg; v3.0 &copy; 2024 Indaptive Technologies Inc.</p>
    </main>
  </body>
</html>
